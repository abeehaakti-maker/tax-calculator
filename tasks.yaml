apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: npm
spec:
  workspaces:
    - name: source
  params:
    - name: args
      type: string
      default: "install"
  steps:
    - name: npm
      image: node:18
      workingDir: $(workspaces.source.path)
      command: ["npm"]
      args: ["$(params.args)"]
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: jasmine
spec:
  workspaces:
    - name: source
  steps:
    - name: jasmine
      image: node:18
      workingDir: $(workspaces.source.path)
      command: ["npx"]
      args: ["jasmine"]